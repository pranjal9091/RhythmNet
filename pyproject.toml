[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-arrhythmia-classification"
version = "1.0.0"
description = "Inter-Patient ECG Arrhythmia Classification pipeline based on MIT-BIH Arrhythmia Database and AAMI EC57 standards."
authors = [
    { name = "ML Engineering Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "wfdb>=4.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.4.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "onnxruntime>=1.15.0",
    "streamlit>=1.25.0",
    "plotly>=5.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
