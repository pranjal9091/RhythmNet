# Classical ML Baselines Configuration (Active in Milestone 5)
models:
  logistic_regression:
    penalty: "l2"
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000

  random_forest:
    n_estimators: 200
    max_depth: 20
    n_jobs: -1
    random_state: 42

  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "hist"
    random_state: 42
