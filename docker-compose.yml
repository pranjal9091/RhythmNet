services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ecg-arrhythmia-api:latest
    container_name: ecg_api
    ports:
      - "8000:8000"
    environment:
      - OMP_NUM_THREADS=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: ecg-arrhythmia-dashboard:latest
    container_name: ecg_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - OMP_NUM_THREADS=1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
